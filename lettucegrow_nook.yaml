blueprint:
  name: "LettuceGrow Nook – Day/Night Light & Pump Controller"
  description: >
    Manages a LettuceGrow Nook hydroponic system with automatic day/night cycles.
    • Day cycle: light ON continuously, pump runs 10 min every hour.
    • Night cycle: light OFF, pump runs 10 min every 3 hours.
    • Supports override modes via input_select helper: normal, snooze, cleaning, spraying.
    • Schedule is adjustable at runtime via input_datetime helpers.
    • Resilient: re-evaluates state on HA start, automation reload, schedule changes,
      and mode changes. Self-loops to maintain pump cycles.
    • Use companion package (lettucegrow_package.yaml) for helpers, scripts, and dashboard.
  domain: automation
  homeassistant:
    min_version: "2025.1.0"

  input:
    schedule:
      name: "Schedule"
      icon: mdi:clock-outline
      collapsed: false
      input:
        day_start_helper:
          name: "Day cycle start time helper"
          description: >
            An input_datetime (time-only) entity for when the day cycle begins.
            Adjustable from the dashboard at any time.
          default: input_datetime.lettucegrow_day_start
          selector:
            entity:
              filter:
                - domain: input_datetime
        day_end_helper:
          name: "Day cycle end time helper"
          description: >
            An input_datetime (time-only) entity for when the night cycle begins.
            Adjustable from the dashboard at any time.
          default: input_datetime.lettucegrow_day_end
          selector:
            entity:
              filter:
                - domain: input_datetime

    devices:
      name: "Devices"
      icon: mdi:sprout
      collapsed: false
      input:
        light_switch:
          name: "Grow light switch"
          description: "The switch entity that controls the grow light."
          selector:
            entity:
              filter:
                - domain: switch
        pump_switch:
          name: "Water pump switch"
          description: "The switch entity that controls the water pump."
          selector:
            entity:
              filter:
                - domain: switch

    overrides:
      name: "Override Control"
      icon: mdi:hand-back-right
      collapsed: true
      input:
        override_mode:
          name: "Override mode helper"
          description: >
            An input_select entity with options: normal, snooze, cleaning, spraying.
            The automation will skip its normal logic when not in 'normal' mode.
            Use the companion package to create this automatically.
          default: input_select.lettucegrow_mode
          selector:
            entity:
              filter:
                - domain: input_select

    timing:
      name: "Pump Timing"
      icon: mdi:timer-outline
      collapsed: true
      input:
        pump_duration_helper:
          name: "Pump run duration helper"
          description: >
            An input_number entity for how long the pump runs each cycle (minutes).
            Adjustable from the dashboard at any time.
          default: input_number.lettucegrow_pump_duration
          selector:
            entity:
              filter:
                - domain: input_number
        day_pump_interval:
          name: "Day pump interval (minutes)"
          description: "How often the pump runs during the day cycle."
          default: 60
          selector:
            number:
              min: 15
              max: 180
              unit_of_measurement: minutes
        night_pump_interval:
          name: "Night pump interval (minutes)"
          description: "How often the pump runs during the night cycle."
          default: 180
          selector:
            number:
              min: 30
              max: 360
              unit_of_measurement: minutes

variables:
  day_start_entity: !input day_start_helper
  day_end_entity: !input day_end_helper
  pump_duration_entity: !input pump_duration_helper
  day_pump_interval: !input day_pump_interval
  night_pump_interval: !input night_pump_interval
  override_mode: !input override_mode

triggers:
  # Day cycle start (dynamic from helper)
  - trigger: time
    at: !input day_start_helper
    id: day_start
  # Night cycle start (dynamic from helper)
  - trigger: time
    at: !input day_end_helper
    id: night_start
  # Resilience: re-evaluate on HA start
  - trigger: homeassistant
    event: start
    id: ha_start
  # Resilience: re-evaluate on automation reload
  - trigger: event
    event_type: automation_reloaded
    id: reload
  # React when override mode returns to normal
  - trigger: state
    entity_id: !input override_mode
    to: "normal"
    id: override_cleared
  # React when schedule is changed from dashboard
  - trigger: state
    entity_id: !input day_start_helper
    id: schedule_changed
  - trigger: state
    entity_id: !input day_end_helper
    id: schedule_changed

conditions:
  # Only run when mode is 'normal' or 'spraying' (pump keeps running during spraying)
  - condition: template
    value_template: "{{ states(override_mode) in ['normal', 'spraying'] }}"

actions:
  - repeat:
      count: 10000
      sequence:
        # Read all dynamic values fresh each iteration
        - variables:
            pump_run: "{{ states(pump_duration_entity) | int(10) }}"
            ds: "{{ states(day_start_entity) }}"
            de: "{{ states(day_end_entity) }}"
            mode_now: "{{ states(override_mode) }}"
            is_day: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% set s = states(day_start_entity) %}
              {% set e = states(day_end_entity) %}
              {% if s < e %}{{ s <= t < e }}{% else %}{{ t >= s or t < e }}{% endif %}

        # Stop looping if mode is not normal or spraying
        - if:
            - condition: template
              value_template: "{{ mode_now not in ['normal', 'spraying'] }}"
          then:
            - stop: "Override mode active — stopping cycle loop"

        # Safety: turn pump off first to prevent extended runs on restart
        - action: switch.turn_off
          target:
            entity_id: !input pump_switch

        # Set light based on mode and time of day
        - if:
            - condition: template
              value_template: "{{ is_day | bool and mode_now == 'normal' }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: !input light_switch
          else:
            - action: switch.turn_off
              target:
                entity_id: !input light_switch

        # Pump ON
        - action: switch.turn_on
          target:
            entity_id: !input pump_switch
        - delay:
            minutes: "{{ pump_run }}"

        # Pump OFF
        - action: switch.turn_off
          target:
            entity_id: !input pump_switch

        # Wait for the off period (day or night interval minus pump run time)
        - delay:
            minutes: >
              {% if is_day | bool %}
                {{ day_pump_interval - pump_run }}
              {% else %}
                {{ night_pump_interval - pump_run }}
              {% endif %}

mode: restart
