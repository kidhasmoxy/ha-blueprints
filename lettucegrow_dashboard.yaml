# ============================================================
# LettuceGrow Nook – Dashboard
# ============================================================
# To use: Settings > Dashboards > Add Dashboard > Manual
# Paste this YAML into the Raw Configuration Editor.
#
# Note: HA's UI editor will resolve anchors to plain entity IDs
# on save. Re-apply anchors here after any UI edits.
# ============================================================

# Define all entity IDs once here — change only this section
anchors:
  light_switch: &light_switch switch.hydroponic_plug_switch
  pump_switch: &pump_switch switch.hydroponic_plug_switch_2
  light_power: &light_power sensor.hydroponic_plug_power
  pump_power: &pump_power sensor.hydroponic_plug_power_2
  light_energy: &light_energy sensor.hydroponic_plug_summation_delivered
  pump_energy: &pump_energy sensor.hydroponic_plug_summation_delivered_2

title: LettuceGrow Nook
views:
  # ===== TAB 1: CONTROL =====
  - title: Control
    path: control
    icon: mdi:sprout
    type: sections
    sections:
      # --- Status ---
      - type: grid
        cards:
          - type: heading
            heading: Status
          - type: entities
            title: System
            show_header_toggle: false
            entities:
              - entity: sensor.lettucegrow_current_cycle
                name: Current Cycle
              - entity: sensor.lettucegrow_pump_status
                name: Pump Status
              - entity: input_select.lettucegrow_mode
                name: Operating Mode
              - entity: timer.lettucegrow_override
                name: Override Timer
          - type: entities
            title: Devices
            show_header_toggle: false
            entities:
              - entity: *light_switch
                name: Grow Light
              - entity: *pump_switch
                name: Water Pump
              - entity: *light_power
                name: Light Power
              - entity: *pump_power
                name: Pump Power
          - type: entity
            entity: sensor.lettucegrow_next_pump_run
            name: Next Pump Run
            icon: mdi:clock-fast
          - type: entity
            entity: input_datetime.lettucegrow_last_pump_run
            name: Last Pump Run
            icon: mdi:clock-check
          - type: history-graph
            title: Activity (24h)
            hours_to_show: 24
            entities:
              - entity: *light_switch
                name: Light
              - entity: *pump_switch
                name: Pump
      # --- Actions ---
      - type: grid
        cards:
          - type: heading
            heading: Actions
          - type: button
            name: Test Pump
            icon: mdi:pump
            tap_action:
              action: perform-action
              perform_action: script.lettucegrow_test_pump
          - type: button
            name: Snooze
            icon: mdi:sleep
            tap_action:
              action: perform-action
              perform_action: script.lettucegrow_snooze
          - type: button
            name: Cleaning Cycle
            icon: mdi:water-sync
            tap_action:
              action: perform-action
              perform_action: script.lettucegrow_cleaning_cycle
          - type: button
            name: Spraying Cycle
            icon: mdi:spray
            tap_action:
              action: perform-action
              perform_action: script.lettucegrow_spraying_cycle
          # Cancel Override (only visible when an override is active)
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.lettucegrow_mode
                state_not: normal
            card:
              type: button
              name: Cancel Override & Resume Normal
              icon: mdi:close-circle
              icon_height: 40px
              tap_action:
                action: perform-action
                perform_action: script.lettucegrow_cancel_override
      # --- Energy ---
      - type: grid
        cards:
          - type: heading
            heading: Energy
          - type: statistic
            entity: *light_energy
            period: &ref_0
              calendar:
                period: day
            stat_type: change
            energy_date_selection: false
            name: Light Energy Today
          - type: statistic
            entity: *pump_energy
            period: *ref_0
            stat_type: change
            theme: Mushroom
            name: Pump Energy Today
          - chart_type: bar
            period: day
            type: statistics-graph
            title: Daily Energy Consumption
            stat_types:
              - sum
            entities:
              - entity: *light_energy
                name: Light
              - entity: *pump_energy
                name: Pump
            energy_date_selection: false
            hide_legend: false
            logarithmic_scale: false
            days_to_show: 5
    # --- Badges: quick-glance status at top of page ---
    badges:
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.lettucegrow_current_cycle
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.lettucegrow_next_pump_run
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_select.lettucegrow_mode
        name: Mode
        tap_action:
          action: none
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: timer.lettucegrow_override
        name: Override Timer
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: timer.lettucegrow_override
            state_not: idle
  # ===== TAB 2: SETTINGS =====
  - title: Settings
    path: settings
    icon: mdi:cog
    type: sections
    sections:
      # --- Schedule ---
      - type: grid
        cards:
          - type: heading
            heading: Schedule
          - type: entities
            title: Day/Night Schedule
            entities:
              - entity: input_datetime.lettucegrow_day_start
                name: Day cycle starts at
              - entity: input_datetime.lettucegrow_day_end
                name: Night cycle starts at
          - type: entities
            title: Pump Timing
            entities:
              - entity: input_number.lettucegrow_pump_duration
                name: Pump run time per cycle
              - entity: input_number.lettucegrow_day_pump_interval
                name: Day interval (minutes between runs)
              - entity: input_number.lettucegrow_night_pump_interval
                name: Night interval (minutes between runs)
      # --- Override Durations ---
      - type: grid
        cards:
          - type: heading
            heading: Override Durations
          - type: entities
            title: Default Durations
            entities:
              - entity: input_number.lettucegrow_test_pump_minutes
                name: Test pump duration
              - entity: input_number.lettucegrow_snooze_minutes
                name: Snooze duration
              - entity: input_number.lettucegrow_spraying_hours
                name: Spraying lights-off duration
      # --- Device Configuration ---
      - type: grid
        cards:
          - type: heading
            heading: Device Configuration
          - type: entities
            title: Entity IDs
            entities:
              - entity: input_text.lettucegrow_light_entity
                name: Light switch entity
              - entity: input_text.lettucegrow_pump_entity
                name: Pump switch entity
      # --- Package Components ---
      - type: grid
        cards:
          - type: heading
            heading: Automations
          - type: entities
            title: Automations
            show_header_toggle: false
            entities:
              - entity: automation.lettucegrow_light_controller
                name: Light Controller
              - entity: automation.lettucegrow_pump_cycle_start
                name: Pump Cycle Start
              - entity: automation.lettucegrow_pump_cycle_end
                name: Pump Cycle End
              - entity: automation.lettucegrow_pump_safety_shutoff
                name: Pump Safety Shutoff
              - entity: automation.lettucegrow_override_expiry
                name: Override Expiry
              - entity: automation.lettucegrow_initialize_defaults
                name: Initialize Defaults
          - type: entities
            title: Scripts
            show_header_toggle: false
            entities:
              - entity: script.lettucegrow_test_pump
                name: Test Pump
              - entity: script.lettucegrow_snooze
                name: Snooze
              - entity: script.lettucegrow_cleaning_cycle
                name: Cleaning Cycle
              - entity: script.lettucegrow_spraying_cycle
                name: Spraying Cycle
              - entity: script.lettucegrow_cancel_override
                name: Cancel Override
          - type: entities
            title: Timers
            show_header_toggle: false
            entities:
              - entity: timer.lettucegrow_pump_run
                name: Pump Run Timer
              - entity: timer.lettucegrow_override
                name: Override Timer
          - type: entities
            title: Sensors
            show_header_toggle: false
            entities:
              - entity: binary_sensor.lettucegrow_is_daytime
                name: Is Daytime
              - entity: sensor.lettucegrow_next_pump_run
                name: Next Pump Run
              - entity: sensor.lettucegrow_pump_status
                name: Pump Status
              - entity: sensor.lettucegrow_current_cycle
                name: Current Cycle
              - entity: input_datetime.lettucegrow_last_pump_run
                name: Last Pump Run
