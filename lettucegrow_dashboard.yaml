# ============================================================
# LettuceGrow Nook – Dashboard
# ============================================================
# To use this dashboard, go to Settings > Dashboards > Add Dashboard
# Choose "Manual" and paste this YAML into the Raw Configuration Editor.
#
# *** CONFIGURE HERE: Change these anchors to match your entity IDs ***
# ============================================================

# Define all entity IDs once here — change only this section
anchors:
  light_switch: &light_switch switch.hydroponic_plug_switch
  pump_switch: &pump_switch switch.hydroponic_plug_switch_2
  light_power: &light_power sensor.hydroponic_plug_power
  pump_power: &pump_power sensor.hydroponic_plug_power_2
  light_energy: &light_energy sensor.hydroponic_plug_summation_delivered
  pump_energy: &pump_energy sensor.hydroponic_plug_summation_delivered_2

title: LettuceGrow Nook
views:
  - title: LettuceGrow
    path: lettucegrow
    icon: mdi:sprout
    type: sections
    sections:
      # ===== STATUS =====
      - title: System Status
        type: grid
        cards:
          - type: entities
            title: Current State
            show_header_toggle: false
            entities:
              - entity: input_select.lettucegrow_mode
                name: Operating Mode
              - entity: *light_switch
                name: Grow Light
              - entity: *pump_switch
                name: Water Pump
              - entity: timer.lettucegrow_override
                name: Override Timer
              - entity: input_datetime.lettucegrow_day_start
                name: Day Starts At
              - entity: input_datetime.lettucegrow_day_end
                name: Night Starts At

          - type: entity
            entity: *light_power
            name: Light Power
            icon: mdi:flash
            unit: W

          - type: entity
            entity: *pump_power
            name: Pump Power
            icon: mdi:flash
            unit: W

          - type: entity
            entity: *light_energy
            name: Light Energy (Total)
            icon: mdi:lightning-bolt
            unit: kWh

          - type: entity
            entity: *pump_energy
            name: Pump Energy (Total)
            icon: mdi:lightning-bolt
            unit: kWh

          - type: history-graph
            title: Activity (24h)
            hours_to_show: 24
            entities:
              - entity: *light_switch
                name: Light
              - entity: *pump_switch
                name: Pump

      # ===== ENERGY =====
      - title: Energy
        type: grid
        cards:
          - type: energy-date-selection

          - type: statistics-graph
            title: Energy Consumption
            period: day
            stat_types:
              - sum
            entities:
              - entity: *light_energy
                name: Light
              - entity: *pump_energy
                name: Pump

      # ===== ACTIONS =====
      - title: Actions
        type: grid
        cards:
          # --- Test Pump ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "### Test Pump"
              - type: entities
                entities:
                  - entity: input_number.lettucegrow_test_pump_minutes
                    name: Duration (minutes)
              - type: button
                name: Run Test Pump
                icon: mdi:pump
                tap_action:
                  action: perform-action
                  perform_action: script.lettucegrow_test_pump

          # --- Snooze ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "### Snooze System"
              - type: entities
                entities:
                  - entity: input_number.lettucegrow_snooze_minutes
                    name: Duration (minutes)
              - type: button
                name: Snooze
                icon: mdi:sleep
                tap_action:
                  action: perform-action
                  perform_action: script.lettucegrow_snooze

          # --- Cleaning Cycle ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "### Cleaning Cycle"
              - type: markdown
                content: >
                  Runs the pump continuously for **2 hours** after adding water.
                  Automation is paused during this time.
              - type: button
                name: Start Cleaning Cycle
                icon: mdi:water-sync
                tap_action:
                  action: perform-action
                  perform_action: script.lettucegrow_cleaning_cycle

          # --- Spraying Cycle ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "### Spraying Cycle"
              - type: markdown
                content: >
                  Keeps lights **OFF** for a set duration after pest spraying.
                  Pump continues to run on its normal schedule.
              - type: entities
                entities:
                  - entity: input_number.lettucegrow_spraying_hours
                    name: Lights-off duration (hours)
              - type: button
                name: Start Spraying Cycle
                icon: mdi:spray
                tap_action:
                  action: perform-action
                  perform_action: script.lettucegrow_spraying_cycle

          # --- Cancel Override ---
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.lettucegrow_mode
                state_not: normal
            card:
              type: button
              name: Cancel Override & Resume Normal
              icon: mdi:close-circle
              icon_height: 40px
              tap_action:
                action: perform-action
                perform_action: script.lettucegrow_cancel_override

      # ===== SCHEDULE ADJUSTMENT =====
      - title: Adjust Day/Night Cycle
        type: grid
        cards:
          - type: markdown
            content: >
              Adjust the day/night schedule below. Changes take effect
              immediately — the automation will re-evaluate within 5 minutes
              or on the next trigger.

          - type: entities
            title: Schedule
            entities:
              - entity: input_datetime.lettucegrow_day_start
                name: Day cycle starts at
              - entity: input_datetime.lettucegrow_day_end
                name: Night cycle starts at
              - entity: input_number.lettucegrow_pump_duration
                name: Pump run time per cycle (min)
