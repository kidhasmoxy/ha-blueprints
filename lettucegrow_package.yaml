# ============================================================
# LettuceGrow Nook – Complete Package
# ============================================================
# Drop this file into your Home Assistant packages/ folder.
# In configuration.yaml, ensure you have:
#   homeassistant:
#     packages: !include_dir_named packages/
#
# This package provides everything needed to run a LettuceGrow
# Nook system. No blueprint required.
#
# How it works (all event-driven, no loops):
#   1. Light automation triggers at day/night times and HA start
#   2. Pump automation triggers every minute, checks if enough
#      time has passed since the last run, then starts a timer
#   3. Pump-off automation fires when the pump run timer ends
#   4. Safety automation catches pump left on too long
#   5. Override scripts (snooze, cleaning, spraying) pause normal
#      operation; override expiry returns to normal
#
# After installing, verify the input_text helpers are correct:
#   input_text.lettucegrow_light_entity → your light switch
#   input_text.lettucegrow_pump_entity  → your pump switch
# ============================================================

# ============================================================
# INPUT HELPERS
# ============================================================
input_text:
  lettucegrow_light_entity:
    name: "LettuceGrow Light Entity"
    icon: mdi:lightbulb
    max: 255

  lettucegrow_pump_entity:
    name: "LettuceGrow Pump Entity"
    icon: mdi:pump
    max: 255

input_select:
  lettucegrow_mode:
    name: "LettuceGrow Mode"
    icon: mdi:sprout
    options:
      - normal
      - snooze
      - cleaning
      - spraying

input_datetime:
  lettucegrow_day_start:
    name: "LettuceGrow Day Start"
    icon: mdi:weather-sunny
    has_date: false
    has_time: true

  lettucegrow_day_end:
    name: "LettuceGrow Day End"
    icon: mdi:weather-night
    has_date: false
    has_time: true

  lettucegrow_last_pump_run:
    name: "LettuceGrow Last Pump Run"
    icon: mdi:clock-check
    has_date: true
    has_time: true

input_number:
  lettucegrow_test_pump_minutes:
    name: "Test Pump Duration"
    icon: mdi:pump
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    mode: slider

  lettucegrow_snooze_minutes:
    name: "Snooze Duration"
    icon: mdi:sleep
    min: 1
    max: 180
    step: 5
    unit_of_measurement: min
    mode: slider

  lettucegrow_pump_duration:
    name: "Pump Run Duration"
    icon: mdi:pump
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    mode: slider

  lettucegrow_day_pump_interval:
    name: "Day Pump Interval"
    icon: mdi:timer-outline
    min: 15
    max: 180
    step: 5
    unit_of_measurement: min
    mode: slider

  lettucegrow_night_pump_interval:
    name: "Night Pump Interval"
    icon: mdi:timer-outline
    min: 30
    max: 360
    step: 10
    unit_of_measurement: min
    mode: slider

  lettucegrow_spraying_hours:
    name: "Spraying Lights-Off Duration"
    icon: mdi:spray
    min: 1
    max: 12
    step: 1
    unit_of_measurement: h
    mode: slider

timer:
  lettucegrow_override:
    name: "LettuceGrow Override Timer"
    icon: mdi:timer-sand

  lettucegrow_pump_run:
    name: "LettuceGrow Pump Run Timer"
    icon: mdi:pump
    restore: true

# ============================================================
# TEMPLATE SENSORS
# ============================================================
template:
  - binary_sensor:
      - name: "LettuceGrow Is Daytime"
        unique_id: lettucegrow_is_daytime
        icon: mdi:white-balance-sunny
        state: >
          {% set t = now().strftime('%H:%M:%S') %}
          {% set s = states('input_datetime.lettucegrow_day_start') %}
          {% set e = states('input_datetime.lettucegrow_day_end') %}
          {% if s < e %}
            {{ s <= t < e }}
          {% else %}
            {{ t >= s or t < e }}
          {% endif %}

  - sensor:
      - name: "LettuceGrow Next Pump Run"
        unique_id: lettucegrow_next_pump_run
        icon: mdi:pump
        device_class: timestamp
        state: >
          {% set ts = state_attr('input_datetime.lettucegrow_last_pump_run', 'timestamp') %}
          {% if ts is none or ts == 0 %}
            unknown
          {% else %}
            {% set is_day = is_state('binary_sensor.lettucegrow_is_daytime', 'on') %}
            {% set interval = states('input_number.lettucegrow_day_pump_interval') | int(60) if is_day else states('input_number.lettucegrow_night_pump_interval') | int(180) %}
            {% set last = ts | as_datetime %}
            {% set next_run = last + timedelta(minutes=interval) %}
            {% if next_run < now() %}{{ now().isoformat() }}{% else %}{{ next_run.isoformat() }}{% endif %}
          {% endif %}

      - name: "LettuceGrow Pump Status"
        unique_id: lettucegrow_pump_status
        icon: mdi:information-outline
        state: >
          {% set mode = states('input_select.lettucegrow_mode') %}
          {% set pump = states('input_text.lettucegrow_pump_entity') %}
          {% set pump_timer = states('timer.lettucegrow_pump_run') %}
          {% if mode not in ['normal', 'spraying'] %}
            {{ mode | title }} (paused)
          {% elif pump not in ['unknown', 'unavailable', ''] and is_state(pump, 'on') %}
            Pump running
          {% elif pump_timer == 'active' %}
            Pump running
          {% else %}
            Idle – waiting for next cycle
          {% endif %}

      - name: "LettuceGrow Current Cycle"
        unique_id: lettucegrow_current_cycle
        icon: mdi:sun-clock
        state: >
          {% set is_day = is_state('binary_sensor.lettucegrow_is_daytime', 'on') %}
          {% set day_start = states('input_datetime.lettucegrow_day_start') %}
          {% set day_end = states('input_datetime.lettucegrow_day_end') %}
          {% if is_day %}
            Day ({{ day_start[:5] }}–{{ day_end[:5] }})
          {% else %}
            Night ({{ day_end[:5] }}–{{ day_start[:5] }})
          {% endif %}

# ============================================================
# SCRIPTS
# ============================================================
script:
  lettucegrow_test_pump:
    alias: "LettuceGrow – Test Pump"
    icon: mdi:pump
    description: "Run the pump for a set number of minutes. Sets mode to snooze during test."
    variables:
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - condition: template
        value_template: "{{ pump_entity not in ['unknown', 'unavailable', ''] }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: snooze
      - action: switch.turn_on
        target:
          entity_id: "{{ pump_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "{{ states('input_number.lettucegrow_test_pump_minutes') | int * 60 }}"
    mode: single

  lettucegrow_snooze:
    alias: "LettuceGrow – Snooze"
    icon: mdi:sleep
    description: "Pause all automation, turn off pump and lights for a set duration."
    variables:
      light_entity: "{{ states('input_text.lettucegrow_light_entity') }}"
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - condition: template
        value_template: "{{ pump_entity not in ['unknown', 'unavailable', ''] and light_entity not in ['unknown', 'unavailable', ''] }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: snooze
      - action: timer.cancel
        target:
          entity_id: timer.lettucegrow_pump_run
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ light_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "{{ states('input_number.lettucegrow_snooze_minutes') | int * 60 }}"
    mode: single

  lettucegrow_cleaning_cycle:
    alias: "LettuceGrow – Cleaning Cycle"
    icon: mdi:water-sync
    description: "Run pump continuously for 2 hours. Automation is paused."
    variables:
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - condition: template
        value_template: "{{ pump_entity not in ['unknown', 'unavailable', ''] }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: cleaning
      - action: switch.turn_on
        target:
          entity_id: "{{ pump_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "7200"
    mode: single

  lettucegrow_spraying_cycle:
    alias: "LettuceGrow – Spraying Cycle"
    icon: mdi:spray
    description: "Keep lights OFF for a configurable duration. Pump continues on its normal schedule."
    variables:
      light_entity: "{{ states('input_text.lettucegrow_light_entity') }}"
      spray_hours: "{{ states('input_number.lettucegrow_spraying_hours') | int }}"
    sequence:
      - condition: template
        value_template: "{{ light_entity not in ['unknown', 'unavailable', ''] }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: spraying
      - action: switch.turn_off
        target:
          entity_id: "{{ light_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "{{ spray_hours * 3600 }}"
    mode: single

  lettucegrow_cancel_override:
    alias: "LettuceGrow – Cancel Override"
    icon: mdi:close-circle
    description: "Cancel any active override and return to normal operation immediately."
    variables:
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.lettucegrow_override
      - if:
          - condition: template
            value_template: "{{ pump_entity not in ['unknown', 'unavailable', ''] }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ pump_entity }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single

# ============================================================
# AUTOMATIONS
# ============================================================
automation:
  # ----------------------------------------------------------
  # 1. LIGHT CONTROLLER
  #    Event-driven: triggers at day/night times, HA start,
  #    and mode changes. Sets light state accordingly.
  # ----------------------------------------------------------
  - id: lettucegrow_light_controller
    alias: "LettuceGrow – Light Controller"
    description: "Manage grow light based on day/night schedule and operating mode."
    triggers:
      - trigger: time
        at: input_datetime.lettucegrow_day_start
        id: day_start
      - trigger: time
        at: input_datetime.lettucegrow_day_end
        id: night_start
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: state
        entity_id: input_select.lettucegrow_mode
        id: mode_changed
      - trigger: state
        entity_id: input_datetime.lettucegrow_day_start
        id: schedule_changed
      - trigger: state
        entity_id: input_datetime.lettucegrow_day_end
        id: schedule_changed
    conditions:
      - condition: template
        value_template: >
          {{ states('input_select.lettucegrow_mode') in ['normal', 'spraying'] }}
    actions:
      - variables:
          light_entity: "{{ states('input_text.lettucegrow_light_entity') }}"
          mode_now: "{{ states('input_select.lettucegrow_mode') }}"
          # Use trigger ID if available; fall back to binary sensor for HA start / mode change
          is_day: "{% if trigger.id == 'day_start' %}true{% elif trigger.id == 'night_start' %}false{% else %}{{ is_state('binary_sensor.lettucegrow_is_daytime', 'on') }}{% endif %}"
      - condition: template
        value_template: "{{ light_entity not in ['unknown', 'unavailable', ''] }}"
      - if:
          - condition: template
            value_template: "{{ is_day | trim | bool and mode_now == 'normal' }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: "{{ light_entity }}"
        else:
          - action: switch.turn_off
            target:
              entity_id: "{{ light_entity }}"
    mode: single

  # ----------------------------------------------------------
  # 2. PUMP CYCLE START
  #    Triggers every minute. Checks if enough time has passed
  #    since the last pump run (day interval or night interval).
  #    If so, turns pump on and starts the pump run timer.
  # ----------------------------------------------------------
  - id: lettucegrow_pump_cycle_start
    alias: "LettuceGrow – Pump Cycle Start"
    description: "Start a pump run when the interval has elapsed."
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      # Only run in normal or spraying mode
      - condition: template
        value_template: >
          {{ states('input_select.lettucegrow_mode') in ['normal', 'spraying'] }}
      # Only run if pump is currently off (don't restart mid-run)
      - condition: template
        value_template: >
          {% set pump = states('input_text.lettucegrow_pump_entity') %}
          {{ pump not in ['unknown', 'unavailable', ''] and is_state(pump, 'off') }}
      # Only run if the pump run timer is not active (pump not in cooldown)
      - condition: state
        entity_id: timer.lettucegrow_pump_run
        state: "idle"
      # Check if enough time has passed since last pump run
      - condition: template
        value_template: >
          {% set ts = state_attr('input_datetime.lettucegrow_last_pump_run', 'timestamp') %}
          {% if ts is none or ts == 0 %}
            true
          {% else %}
            {% set is_day = is_state('binary_sensor.lettucegrow_is_daytime', 'on') %}
            {% set interval = states('input_number.lettucegrow_day_pump_interval') | int(60) if is_day else states('input_number.lettucegrow_night_pump_interval') | int(180) %}
            {% set elapsed = (as_timestamp(now()) - ts) / 60 %}
            {{ elapsed >= interval }}
          {% endif %}
    actions:
      - variables:
          pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
          pump_run_min: "{{ states('input_number.lettucegrow_pump_duration') | int(10) }}"
      # Record start time first so interval is measured start-to-start
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.lettucegrow_last_pump_run
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: switch.turn_on
        target:
          entity_id: "{{ pump_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_pump_run
        data:
          duration: "{{ pump_run_min * 60 }}"
    mode: single

  # ----------------------------------------------------------
  # 3. PUMP CYCLE END
  #    Fires when the pump run timer finishes. Turns pump off.
  # ----------------------------------------------------------
  - id: lettucegrow_pump_cycle_end
    alias: "LettuceGrow – Pump Cycle End"
    description: "Turn pump off when run timer finishes."
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.lettucegrow_pump_run
    actions:
      - variables:
          pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
      - if:
          - condition: template
            value_template: "{{ pump_entity not in ['unknown', 'unavailable', ''] }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ pump_entity }}"
    mode: single

  # ----------------------------------------------------------
  # 4. PUMP SAFETY
  #    If the pump has been on longer than pump_duration + 5 min
  #    and we're not in cleaning mode, force it off.
  # ----------------------------------------------------------
  - id: lettucegrow_pump_safety
    alias: "LettuceGrow – Pump Safety Shutoff"
    description: "Force pump off if it has been on too long (catches edge cases)."
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: template
        value_template: >
          {% set pump = states('input_text.lettucegrow_pump_entity') %}
          {% set mode = states('input_select.lettucegrow_mode') %}
          {% set max_min = states('input_number.lettucegrow_pump_duration') | int(10) + 5 %}
          {% if pump in ['unknown', 'unavailable', ''] %}
            false
          {% elif mode == 'cleaning' %}
            false
          {% elif states(pump) == 'on' %}
            {% set changed = states[pump].last_changed if states[pump] is not none else now() %}
            {% set on_for = (now() - changed).total_seconds() / 60 %}
            {{ on_for > max_min }}
          {% else %}
            false
          {% endif %}
    actions:
      - variables:
          pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: timer.cancel
        target:
          entity_id: timer.lettucegrow_pump_run
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.lettucegrow_last_pump_run
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    mode: single

  # ----------------------------------------------------------
  # 5. OVERRIDE EXPIRY
  #    When the override timer finishes, return to normal mode.
  #    Also turns off pump if it was left on (e.g. test pump).
  # ----------------------------------------------------------
  - id: lettucegrow_override_expiry
    alias: "LettuceGrow – Override Expiry"
    description: "Return to normal mode when override timer finishes."
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.lettucegrow_override
    actions:
      - variables:
          pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
      - if:
          - condition: template
            value_template: "{{ pump_entity not in ['unknown', 'unavailable', ''] }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ pump_entity }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single

  # ----------------------------------------------------------
  # 6. INITIALIZATION
  #    On first boot (or if helpers are empty), set sensible
  #    defaults. Does nothing if values are already configured.
  # ----------------------------------------------------------
  - id: lettucegrow_initialize_defaults
    alias: "LettuceGrow – Initialize Defaults"
    description: "Set default values for helpers on first install only."
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # --- input_text: set entity IDs if empty ---
      - if:
          - condition: template
            value_template: "{{ states('input_text.lettucegrow_light_entity') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.lettucegrow_light_entity
            data:
              value: "switch.hydroponic_plug_switch"
      - if:
          - condition: template
            value_template: "{{ states('input_text.lettucegrow_pump_entity') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.lettucegrow_pump_entity
            data:
              value: "switch.hydroponic_plug_switch_2"
      # --- input_datetime: set schedule if at midnight (unconfigured) ---
      - if:
          - condition: template
            value_template: "{{ states('input_datetime.lettucegrow_day_start') in ['unknown', 'unavailable', '00:00:00'] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.lettucegrow_day_start
            data:
              time: "06:00:00"
      - if:
          - condition: template
            value_template: "{{ states('input_datetime.lettucegrow_day_end') in ['unknown', 'unavailable', '00:00:00'] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.lettucegrow_day_end
            data:
              time: "22:00:00"
      # --- input_number: set defaults if at minimum (unconfigured) ---
      - if:
          - condition: template
            value_template: "{{ states('input_number.lettucegrow_pump_duration') | float(0) <= 1 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lettucegrow_pump_duration
            data:
              value: 2
      - if:
          - condition: template
            value_template: "{{ states('input_number.lettucegrow_day_pump_interval') | float(0) <= 15 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lettucegrow_day_pump_interval
            data:
              value: 60
      - if:
          - condition: template
            value_template: "{{ states('input_number.lettucegrow_night_pump_interval') | float(0) <= 30 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lettucegrow_night_pump_interval
            data:
              value: 180
      - if:
          - condition: template
            value_template: "{{ states('input_number.lettucegrow_test_pump_minutes') | float(0) <= 1 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lettucegrow_test_pump_minutes
            data:
              value: 5
      - if:
          - condition: template
            value_template: "{{ states('input_number.lettucegrow_snooze_minutes') | float(0) <= 1 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lettucegrow_snooze_minutes
            data:
              value: 30
      - if:
          - condition: template
            value_template: "{{ states('input_number.lettucegrow_spraying_hours') | float(0) <= 1 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lettucegrow_spraying_hours
            data:
              value: 6
    mode: single
