# ============================================================
# LettuceGrow Nook – Companion Package
# ============================================================
# Drop this file into your Home Assistant packages/ folder.
# In configuration.yaml, ensure you have:
#   homeassistant:
#     packages: !include_dir_named packages/
#
# This package provides:
#   • input_text helpers for device entity IDs (configure once in UI)
#   • input_select for override mode (normal/snooze/cleaning/spraying)
#   • input_datetime for adjustable day/night schedule
#   • input_number for test pump duration and snooze duration
#   • timer helpers for tracking override countdowns
#   • Scripts: test_pump, snooze, cleaning_cycle, spraying_cycle, cancel_override
#   • Automations: auto-expire overrides when timers finish
#
# After installing, set the input_text helpers via the UI or automations:
#   input_text.lettucegrow_light_entity → your light switch entity_id
#   input_text.lettucegrow_pump_entity  → your pump switch entity_id
# ============================================================

# ============================================================
# INPUT HELPERS
# ============================================================
input_text:
  lettucegrow_light_entity:
    name: "LettuceGrow Light Entity"
    icon: mdi:lightbulb
    initial: "switch.hydroponic_plug_switch"
    max: 255

  lettucegrow_pump_entity:
    name: "LettuceGrow Pump Entity"
    icon: mdi:pump
    initial: "switch.hydroponic_plug_switch_2"
    max: 255

input_select:
  lettucegrow_mode:
    name: "LettuceGrow Mode"
    icon: mdi:sprout
    options:
      - normal
      - snooze
      - cleaning
      - spraying

input_datetime:
  lettucegrow_day_start:
    name: "LettuceGrow Day Start"
    icon: mdi:weather-sunny
    has_date: false
    has_time: true
    initial: "06:00:00"

  lettucegrow_day_end:
    name: "LettuceGrow Day End"
    icon: mdi:weather-night
    has_date: false
    has_time: true
    initial: "22:00:00"

input_number:
  lettucegrow_test_pump_minutes:
    name: "Test Pump Duration"
    icon: mdi:pump
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    mode: slider

  lettucegrow_snooze_minutes:
    name: "Snooze Duration"
    icon: mdi:sleep
    min: 1
    max: 180
    step: 5
    unit_of_measurement: min
    mode: slider

  lettucegrow_spraying_hours:
    name: "Spraying Lights-Off Duration"
    icon: mdi:spray
    min: 1
    max: 12
    step: 1
    unit_of_measurement: h
    mode: slider
    initial: 6

timer:
  lettucegrow_override:
    name: "LettuceGrow Override Timer"
    icon: mdi:timer-sand

# ============================================================
# SCRIPTS
# ============================================================
script:
  lettucegrow_test_pump:
    alias: "LettuceGrow – Test Pump"
    icon: mdi:pump
    description: "Run the pump for a set number of minutes without affecting automation."
    variables:
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: snooze
      - action: switch.turn_on
        target:
          entity_id: "{{ pump_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "{{ states('input_number.lettucegrow_test_pump_minutes') | int * 60 }}"
      - delay:
          minutes: "{{ states('input_number.lettucegrow_test_pump_minutes') | int }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single

  lettucegrow_snooze:
    alias: "LettuceGrow – Snooze"
    icon: mdi:sleep
    description: "Pause automation, turn off pump and lights for a set duration."
    variables:
      light_entity: "{{ states('input_text.lettucegrow_light_entity') }}"
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: snooze
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ light_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "{{ states('input_number.lettucegrow_snooze_minutes') | int * 60 }}"
    mode: single

  lettucegrow_cleaning_cycle:
    alias: "LettuceGrow – Cleaning Cycle"
    icon: mdi:water-sync
    description: "Run pump continuously for 2 hours (after adding water). Automation is paused."
    variables:
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: cleaning
      - action: switch.turn_on
        target:
          entity_id: "{{ pump_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "7200"
      - delay:
          hours: 2
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single

  lettucegrow_spraying_cycle:
    alias: "LettuceGrow – Spraying Cycle"
    icon: mdi:spray
    description: "Keep lights OFF for a configurable duration after pest spraying. Pump continues to run normally."
    variables:
      light_entity: "{{ states('input_text.lettucegrow_light_entity') }}"
      spray_hours: "{{ states('input_number.lettucegrow_spraying_hours') | int }}"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: spraying
      - action: switch.turn_off
        target:
          entity_id: "{{ light_entity }}"
      - action: timer.start
        target:
          entity_id: timer.lettucegrow_override
        data:
          duration: "{{ spray_hours * 3600 }}"
      - delay:
          hours: "{{ spray_hours }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single

  lettucegrow_cancel_override:
    alias: "LettuceGrow – Cancel Override"
    icon: mdi:close-circle
    description: "Cancel any active override and return to normal operation."
    variables:
      pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.lettucegrow_override
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single

# ============================================================
# AUTOMATION: Expire override when timer finishes
# (backup in case script delay doesn't fire after restart)
# ============================================================
automation:
  - id: lettucegrow_override_expiry
    alias: "LettuceGrow – Override Expiry"
    description: "Return to normal mode when override timer finishes (resilience backup)."
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.lettucegrow_override
    actions:
      - variables:
          pump_entity: "{{ states('input_text.lettucegrow_pump_entity') }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ pump_entity }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.lettucegrow_mode
        data:
          option: normal
    mode: single
